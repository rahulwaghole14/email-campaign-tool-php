<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80" role="img" aria-label="RSL Solution Logo">
  <defs>
    <!-- Vivid neon green gradient — top highlight to deep green -->
    <linearGradient id="lg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#93f540"/>
      <stop offset="40%"  stop-color="#55d410"/>
      <stop offset="100%" stop-color="#237a02"/>
    </linearGradient>

    <!-- Diagonal shine overlay -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#c8ff80" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#7fe832" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2a8a05" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft outer glow for the whole RSL group -->
    <filter id="glow" x="-18%" y="-18%" width="136%" height="136%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"   result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle dot glow for network nodes -->
    <filter id="dg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- === NETWORK DOTS === -->
  <g filter="url(#dg)" opacity="0.80">
    <circle cx="18"  cy="7"  r="2.2" fill="#7fe832"/>
    <circle cx="60"  cy="4"  r="1.5" fill="#55d410"/>
    <circle cx="108" cy="6"  r="2.0" fill="#7fe832"/>
    <circle cx="152" cy="5"  r="1.5" fill="#4cc811"/>
    <circle cx="178" cy="13" r="1.8" fill="#6ee028"/>
    <circle cx="6"   cy="32" r="1.6" fill="#6ee028"/>
    <circle cx="182" cy="38" r="1.5" fill="#4cc811"/>
    <circle cx="78"  cy="2"  r="1.3" fill="#7fe832"/>
    <circle cx="160" cy="46" r="1.4" fill="#55d410"/>
    <circle cx="10"  cy="58" r="1.8" fill="#6ee028"/>
    <circle cx="174" cy="63" r="1.3" fill="#4cc811"/>
    <circle cx="28"  cy="74" r="2.0" fill="#7fe832"/>
    <circle cx="78"  cy="77" r="1.4" fill="#55d410"/>
    <circle cx="124" cy="75" r="1.8" fill="#7fe832"/>
    <circle cx="164" cy="74" r="1.6" fill="#4cc811"/>
  </g>

  <!-- === NETWORK LINES === -->
  <g stroke="#5fd420" stroke-width="0.65" opacity="0.38" stroke-linecap="round">
    <line x1="18"  y1="7"  x2="60"  y2="4"/>
    <line x1="60"  y1="4"  x2="108" y2="6"/>
    <line x1="108" y1="6"  x2="152" y2="5"/>
    <line x1="152" y1="5"  x2="178" y2="13"/>
    <line x1="18"  y1="7"  x2="6"   y2="32"/>
    <line x1="178" y1="13" x2="182" y2="38"/>
    <line x1="60"  y1="4"  x2="78"  y2="2"/>
    <line x1="6"   y1="32" x2="10"  y2="58"/>
    <line x1="182" y1="38" x2="160" y2="46"/>
    <line x1="160" y1="46" x2="174" y2="63"/>
    <line x1="10"  y1="58" x2="28"  y2="74"/>
    <line x1="28"  y1="74" x2="78"  y2="77"/>
    <line x1="78"  y1="77" x2="124" y2="75"/>
    <line x1="124" y1="75" x2="164" y2="74"/>
    <line x1="164" y1="74" x2="174" y2="63"/>
    <line x1="108" y1="6"  x2="124" y2="75"/>
  </g>

  <!-- === RSL LETTERS — bold italic, vivid neon green === -->
  <g filter="url(#glow)">
    <!-- Base gradient fill -->
    <text
      x="16" y="68"
      font-family="'Arial Black','Impact','Franklin Gothic Heavy',sans-serif"
      font-size="64"
      font-weight="900"
      font-style="italic"
      letter-spacing="-3"
      fill="url(#lg)"
    >RSL</text>
    <!-- Shine overlay -->
    <text
      x="16" y="68"
      font-family="'Arial Black','Impact','Franklin Gothic Heavy',sans-serif"
      font-size="64"
      font-weight="900"
      font-style="italic"
      letter-spacing="-3"
      fill="url(#shine)"
      opacity="0.45"
    >RSL</text>
  </g>
</svg>
